# Bundle layer for @hitzhangjie/dsh-plugin-github-orchestrator.
#
# A Host-only bundle: it contributes agent tools and runtime context, no
# browser half. Workspace root, repositories and polling can be set either in
# this config (initial values) or at runtime through the github_config tool.
- insert:
    - id: hitzhangjie-github-orchestrator
      name: '@hitzhangjie/dsh-plugin-github-orchestrator'
      config:
        # Absolute path of the directory that holds repository checkouts and
        # worktrees. Empty means <DSH_HOME>/github-work.
        workspaceRoot: ''
        # Repositories to watch: "owner/name" or
        # { repo, local?, baseBranch? }.
        repos: []
        pollIntervalSec: 120
        defaultBaseBranch: main
        branchPrefix: 'task/'
        # OAuth App client id for the in-plugin "Sign in with GitHub" device
        # flow. Empty uses GITHUB_OAUTH_CLIENT_ID, then the documented built-in
        # public fallback. Create your own OAuth App at
        # https://github.com/settings/developers and enable device flow.
        oauthClientId: ''
        oauthScopes: 'repo read:user'
        # Always-on automation: newly observed events become storyboard tasks and
        # prompts in a persistent watcher session. Off by default; enable with
        # github_config action=set autoDispatch=true or the panel's Automation tab.
        autoDispatch: false
        autoDispatchKinds: ['issue', 'pr', 'review']
        autoDispatchMinIntervalSec: 120
        autoDispatchMaxEvents: 5
        autoDispatchCreateTasks: true
        autoDispatchTaskStatus: ready
        # Agent preset for the watcher session (standard or cordis).
        autoDispatchAgentPreset: standard
