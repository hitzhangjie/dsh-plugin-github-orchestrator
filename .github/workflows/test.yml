name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run offline test suite
        # The plugin supports Node >= 22.5 at runtime. CI pins the active Node
        # 24 line because Node 22's test runner cancels a whole file once only
        # unref'd timers remain between subtests (a runner quirk, not a product
        # failure: all tests pass and fail count stays 0 there as well).
        run: node --test "test/**/*.test.js"
